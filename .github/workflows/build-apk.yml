name: Android CI - Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        run: |
          # GitHub runner has Android SDK pre-installed at /usr/local/lib/android/sdk
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Add SDK commandline tools and platform tools to PATH
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          
          # Pre-accept all Android SDK licenses directly into license files
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          
          # Accept any remaining licenses via sdkmanager
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Generate Wrapper and Build Android Debug APK
        run: |
          echo "=== 1. Checking environment & permissions ==="
          ls -lah
          chmod +x gradlew || true

          echo "=== 2. Generating Gradle Wrapper ==="
          gradle wrapper --gradle-version 8.5 --distribution-type bin || true
          chmod +x gradlew || true

          echo "=== 3. Compiling Android Debug APK ==="
          # Execute assembleDebug using global Gradle 8.5 CLI directly (guaranteed to avoid wrapper class errors)
          gradle assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Prepare APK for Distribution
        run: |
          mkdir -p output_apks
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "SUCCESS: Found compiled APK at: $APK_FILE"
            cp "$APK_FILE" output_apks/ProRecorder-debug.apk
            ls -lah output_apks/
          else
            echo "Error: No APK file generated in app/build/outputs/apk/"
            exit 1
          fi



      - name: Upload Public APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProRecorder-Android-APK
          path: output_apks/ProRecorder-debug.apk
          retention-days: 30

      - name: Publish Public GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/ProRecorder-debug.apk
          name: Pro Recorder Android Release v1.0.${{ github.run_number }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

